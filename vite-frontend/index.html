<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    
    <title>Cat Tunnel Panel</title>
    <script>
      // 防止首屏皮肤与暗黑模式闪烁：在页面加载前同步应用初始皮肤与明暗模式
      (function() {
        var LEGACY_DEFAULT_SKINS = { sanyue: true, aurora: true };
        var DARK_SKINS = {
          sanyue: true, aurora: true, deepsea: true, cyber: true,
          midnight: true, forest: true, lava: true, grape: true, steel: true
        };
        var VALID_SKINS = {
          pixel: true, sanyue: true, aurora: true, mesh: true, deepsea: true,
          sunrise: true, cyber: true, mint: true, midnight: true, clean: true,
          forest: true, lava: true, sakura: true, grape: true, sand: true, steel: true
        };

        var skinId = 'pixel';
        var storedMode = null;
        try {
          var saved = localStorage.getItem('skin');
          if (localStorage.getItem('skinDefaultV3') !== '1') {
            if (saved === null || LEGACY_DEFAULT_SKINS[saved]) {
              saved = 'pixel';
            }
            localStorage.setItem('skinDefaultV3', '1');
          }
          if (saved && VALID_SKINS[saved]) {
            skinId = saved;
          }
          storedMode = localStorage.getItem('pixel_mode');
        } catch (e) {}

        var html = document.documentElement;
        html.classList.add(skinId);
        html.setAttribute('data-skin', skinId);

        var isDarkMode = skinId === 'pixel'
          ? (storedMode === 'dark'
              ? true
              : storedMode === 'light'
              ? false
              : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches))
          : !!DARK_SKINS[skinId];

        // 立即设置主题类，避免闪烁
        if (isDarkMode) {
          html.classList.add('dark');
          html.style.colorScheme = 'dark';
        } else {
          html.classList.remove('dark');
          html.style.colorScheme = 'light';
        }

        // 监听系统主题变化（仅当处于像素黑白灰主题且未手动锁定明暗模式时跟随系统）
        if (window.matchMedia) {
          window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function(e) {
            var currentSkin = document.documentElement.getAttribute('data-skin');
            var manualMode = null;
            try {
              manualMode = localStorage.getItem('pixel_mode');
            } catch (err) {}
            if (currentSkin && currentSkin !== 'pixel') return;
            if (manualMode === 'light' || manualMode === 'dark') return;
            var nextMode = e.matches ? 'dark' : 'light';
            if (e.matches) {
              document.documentElement.classList.add('dark');
              document.documentElement.style.colorScheme = 'dark';
            } else {
              document.documentElement.classList.remove('dark');
              document.documentElement.style.colorScheme = 'light';
            }
            try {
              window.dispatchEvent(new CustomEvent('tms-skin-changed', {
                detail: { skinId: 'pixel', mode: nextMode }
              }));
            } catch (err) {}
          });
        }
        
        // 检测H5模式并设置标记，避免布局切换时的闪屏
        const isMobile = window.innerWidth <= 768;
        const isMobileBrowser = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
        const urlParams = new URLSearchParams(window.location.search);
        const isH5Param = urlParams.get('h5') === 'true';
        
        if (isMobile || isMobileBrowser || isH5Param) {
          document.documentElement.classList.add('h5-mode');
        } else {
          document.documentElement.classList.add('pc-mode');
        }
      })();
    </script>
    <style>
      /* 防止页面闪烁的基础样式 */
      :root {
        --toaster-bg: #ffffff;
        --toaster-color: #000000;
        --toaster-border: #e5e7eb;
      }
      
      html.dark {
        --toaster-bg: #374151;
        --toaster-color: #ffffff;
        --toaster-border: #4b5563;
      }
      
      /* 默认浅色主题样式 */
      body {
        margin: 0;
        padding: 0;
        background-color: #ffffff;
        color: #000000;
        transition: background-color 0.2s ease, color 0.2s ease;
        /* 禁用弹性滚动 */
        overscroll-behavior: none;
        -webkit-overflow-scrolling: touch;
      }
      
      /* 暗色主题样式 */
      html.dark body {
        background-color: #000000;
        color: #ffffff;
      }
      
      #root {
        min-height: 100vh;
        background-color: inherit;
        /* 确保根元素也禁用弹性滚动 */
        overscroll-behavior: none;
      }

      /* 使用动态视口单位，避免移动端地址栏导致的额外滚动 */
      @supports (height: 100dvh) {
        #root { min-height: 100dvh; }
      }

      /* iOS Safari 旧版本兼容 */
      @supports (-webkit-touch-callout: none) {
        #root { min-height: -webkit-fill-available; }
      }
      
      /* 防止加载时的闪烁 */
      * {
        box-sizing: border-box;
      }
      
      /* 确保在主题切换时平滑过渡 */
      html {
        transition: color-scheme 0.2s ease;
        /* 禁用整个页面的弹性滚动 */
        overscroll-behavior: none;
      }
      
      /* 防止布局切换时的闪屏 */
      .h5-mode #root {
        background-color: #ffffff;
      }
      
      .h5-mode.dark #root {
        background-color: #000000;
      }
      
      .pc-mode #root {
        background-color: #ffffff;
      }
      
      .pc-mode.dark #root {
        background-color: #000000;
      }

      /* 像素黑白灰主题首屏防 FOUC：CSS bundle 加载前即呈现点阵底纹 */
      html[data-skin="pixel"] {
        background-color: #f5f5f5;
        background-image: radial-gradient(rgba(17, 17, 17, 0.12) 1px, transparent 1px);
        background-size: 16px 16px;
        background-attachment: fixed;
      }

      html[data-skin="pixel"].dark {
        background-color: #0d0d0d;
        background-image: radial-gradient(rgba(250, 250, 250, 0.11) 1px, transparent 1px);
        background-size: 16px 16px;
        background-attachment: fixed;
      }

      html[data-skin="pixel"] body,
      html[data-skin="pixel"] #root {
        background-color: transparent;
      }
            
      /* 移动端滚动优化 */
      @media (max-width: 768px) {
        html, body {
          overscroll-behavior: none;
          -webkit-overflow-scrolling: touch;
        }
        
        /* 确保固定定位的元素不受滚动影响 */
        .fixed {
          overscroll-behavior: none;
        }
      }
    </style>
    <meta key="title" content="Cat Tunnel Panel" property="og:title" />
    <meta
      content="Cat Tunnel Panel"
      property="og:description"
    />
    <meta
      content="Cat Tunnel Panel"
      name="description"
    />
    <meta
      key="viewport"
      content="viewport-fit=cover, width=device-width, initial-scale=1.0, user-scalable=no"
      name="viewport"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
