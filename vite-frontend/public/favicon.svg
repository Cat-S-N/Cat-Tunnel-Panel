<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" shape-rendering="crispEdges">
  <!-- 浅灰白像素方徽章底托 + 黑色像素外框，确保明暗浏览器标签页均清晰锐利 -->
  <rect x="1" y="1" width="18" height="18" fill="#F5F5F5" />
  <rect x="1" y="0" width="18" height="1" fill="#111111" />
  <rect x="1" y="19" width="18" height="1" fill="#111111" />
  <rect x="0" y="1" width="1" height="18" fill="#111111" />
  <rect x="19" y="1" width="1" height="18" fill="#111111" />

  <!-- 黑色像素风小猫剪影 -->
  <g fill="#111111">
    <rect x="4" y="3" width="1" height="1" />
    <rect x="4" y="4" width="2" height="1" />
    <rect x="4" y="5" width="3" height="1" />
    <rect x="15" y="3" width="1" height="1" />
    <rect x="14" y="4" width="2" height="1" />
    <rect x="13" y="5" width="3" height="1" />
    <rect x="4" y="6" width="12" height="1" />
    <rect x="3" y="7" width="14" height="5" />
    <rect x="4" y="12" width="12" height="1" />
    <rect x="5" y="13" width="10" height="1" />
    <rect x="6" y="14" width="8" height="1" />
    <rect x="5" y="15" width="10" height="2" />
  </g>

  <!-- 内耳深灰细节 -->
  <g fill="#525252">
    <rect x="5" y="5" width="1" height="1" />
    <rect x="14" y="5" width="1" height="1" />
  </g>

  <!-- 白色像素眼睛 -->
  <g fill="#FFFFFF">
    <rect x="6" y="9" width="2" height="2" />
    <rect x="12" y="9" width="2" height="2" />
  </g>

  <!-- 浅灰像素鼻尖 -->
  <g fill="#D4D4D4">
    <rect x="9" y="11" width="2" height="1" />
  </g>

  <!-- 像素胡须点缀 -->
  <g fill="#737373">
    <rect x="3" y="11" width="1" height="1" />
    <rect x="16" y="11" width="1" height="1" />
  </g>
</svg>
